# Coolify: deployed as a "Docker Compose" resource. Secrets live in Coolify's
# environment tab (referenced here with ${VAR}). The web service is not
# published on the host; Coolify's Traefik proxy routes the domain to port 3000.
# Local run without Coolify:  docker compose up --build  then open
# http://localhost:3000 after adding `ports: ["3000:3000"]` to the web service
# (or use docker-compose.local.yml below).
services:
  web:
    build: .
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-blend}:${POSTGRES_PASSWORD:-blend}@db:5432/${POSTGRES_DB:-blend}?schema=public
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-flash}
      AUTH_SECRET: ${AUTH_SECRET}
      AUTH_TRUST_HOST: "true"
      NEXTAUTH_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
      STORAGE_DIR: /data/storage
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_PRICE_STARTER: ${STRIPE_PRICE_STARTER:-}
      STRIPE_PRICE_PRO: ${STRIPE_PRICE_PRO:-}
      CRON_SECRET: ${CRON_SECRET:-change-me}
      SEED_ON_BOOT: ${SEED_ON_BOOT:-1}
    volumes:
      - storage:/data/storage
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-blend}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-blend}
      POSTGRES_DB: ${POSTGRES_DB:-blend}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-blend} -d ${POSTGRES_DB:-blend}"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  pgdata:
  storage:
